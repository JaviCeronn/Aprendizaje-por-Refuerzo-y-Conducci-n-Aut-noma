[project]
name = "rl-duckietown"
version = "0.1.0"
requires-python = "==3.11.*"
dependencies = [
    # RL stack (Stable-Baselines3 / Gymnasium / PyTorch)
    "stable-baselines3==2.2.1",
    "gymnasium==0.29.1",
    "torch==2.12.0",
    "numpy==1.23.5",

    # API antigua de gym (requerida por gym-duckietown)
    "gym==0.25.2",
    "pyglet==1.5.27",

    # Vision / imagen / video
    "opencv-python-headless==4.11.0.86",
    "scikit-image==0.24.0",
    "scipy==1.15.3",
    "Pillow==12.2.0",
    "imageio==2.37.3",
    "imageio-ffmpeg==0.6.0",
    "matplotlib==3.8.4",

    # pandas: <3 porque pandas>=3 exige numpy>=1.26, incompatible con 1.23.5
    "pandas<3",

    # Infraestructura y render headless
    "pyzmq==27.1.0",
    "PyYAML==6.0.3",
    "pyvirtualdisplay==3.0",

    # Stack Duckietown "daffy"
    "zuper-commons-z6==6.2.4",
    "zuper-ipce-z6==6.1.2",
    "zuper-nodes-z6==6.2.17",
    "zuper-typing-z6==6.2.3",
    "PyGeometry-z6==2.1.5",
    "carnivalmirror==0.6.2",
    "aido-protocols-daffy==6.1.1",
    "duckietown-serialization-ds1==1.1.1",
    "duckietown-world-daffy==6.4.3",
    "pycontracts3==7.2",

    # Simulador Duckietown (git, sin sus pins de numpy)
    "duckietown-gym-daffy @ git+https://github.com/duckietown/gym-duckietown.git@daffy",
]

[tool.uv]
# gym-duckietown pide numpy<=1.20.0 en su setup.py pero funciona con 1.23.5.
# Este override fuerza la version correcta ignorando ese pin obsoleto.
override-dependencies = [
    "numpy==1.23.5",
]
